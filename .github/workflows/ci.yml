name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck Amplify backend
        run: npx tsc --noEmit

      - name: Verify schema constructs
        run: npx tsx -e "import('./amplify/data/resource.ts').then(() => console.log('schema ok'))"

  ios:
    name: iOS · build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # Skips cleanly until the source folder is committed, so this workflow is
      # useful today rather than only after the app compiles.
      - name: Check for app sources
        id: sources
        run: |
          if [ -d "MatReturnRx Dev/MatReturnRx Dev" ] || [ -d "MatReturnRx Dev" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Swift sources found. Commit the 'MatReturnRx Dev/' folder to enable the build."
          fi

      - name: Resolve package dependencies
        if: steps.sources.outputs.present == 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "MatReturnRx Dev.xcodeproj" \
            -scheme "MatReturnRx Dev"

      - name: Build
        if: steps.sources.outputs.present == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project "MatReturnRx Dev.xcodeproj" \
            -scheme "MatReturnRx Dev" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test
        if: steps.sources.outputs.present == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project "MatReturnRx Dev.xcodeproj" \
            -scheme "MatReturnRx Dev" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
        continue-on-error: true
